# Build, run unit tests, and run examples

name: CMake build and run unit test matrix

on: 
  pull_request:
    types:
      # - opened
      #- reopened
  push:
    branches:
      - main
      - dev

env:
  BUILD_TYPE: Release

jobs:
  build_matrix:
    strategy:
      matrix:
        platform:
          - { name: Windows VS2019, os: windows-2019 }
          - { name: Windows VS2022, os: windows-2022 }
          - { name: Windows-Latest, os: windows-latest }
          - { name: Linux GCC,      os: ubuntu-latest }
          - { name: Linux Clang,    os: ubuntu-latest, flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ }
          - { name: macOS,          os: macos-latest }
        #os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: create-build-dir
        run: mkdir build

      - name: configure-cmake
        run: cd build && cmake -D CAFE_MENU_BUILD_TESTS:BOOL=ON -D CAFE_MENU_BUILD_EXAMPLES:BOOL=ON ..

      - name: build
        run: cd build && cmake --build . --config $BUILD_TYPE

      - name: run-unit-test
        run: cd build && ctest -C $BUILD_TYPE
